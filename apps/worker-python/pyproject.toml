[project]
name = "engrove-worker"
version = "0.1.0"
description = "Private scientific compute service for Engrove Community"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.128.0",
  "httpx==0.28.1",
  "pyarrow==23.0.1",
  "pydantic-settings==2.12.0",
  "python-json-logger==4.0.0",
  "uvicorn[standard]==0.40.0",
]

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.14",
]

[project.scripts]
engrove-worker = "engrove_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engrove_worker"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/engrove_worker/generated_units.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["engrove_worker"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["engrove_worker"]
