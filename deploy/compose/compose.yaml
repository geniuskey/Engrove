name: engrove-community

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  ENGROVE_VERSION: ${ENGROVE_VERSION:-0.1.0}
  ENGROVE_PUBLIC_URL: ${ENGROVE_PUBLIC_URL:-http://localhost:4173}
  ENGROVE_API_PORT: 3000
  ENGROVE_SETUP_TOKEN: ${ENGROVE_SETUP_TOKEN:-engrove_setup_dev_only_token_32_chars}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
  SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-168}
  ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
  ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
  ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
  DATABASE_URL: postgresql://engrove:${POSTGRES_PASSWORD:-engrove_dev_only}@postgres:5432/engrove
  DATABASE_MIGRATION_URL: postgresql://engrove:${POSTGRES_PASSWORD:-engrove_dev_only}@postgres:5432/engrove
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-engrove-development}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-engrove_dev}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-engrove_dev_only}
  S3_FORCE_PATH_STYLE: 'true'
  PYTHON_WORKER_BASE_URL: http://worker-python:8000
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-engrove_internal_dev_only}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
  OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
  OIDC_NAME_CLAIM: ${OIDC_NAME_CLAIM:-name}
  OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
  OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
  OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-viewer}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: engrove
      POSTGRES_USER: engrove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engrove_dev_only}
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U engrove -d engrove']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.4.0-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-engrove_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-engrove_dev_only}
    ports: ['${MINIO_API_PORT:-9000}:9000', '${MINIO_CONSOLE_PORT:-9001}:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc version enable "local/$${S3_BUCKET}"
    environment:
      S3_BUCKET: ${S3_BUCKET:-engrove-development}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-engrove_dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-engrove_dev_only}

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/migrate.js']
    environment: *app-environment
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment: *app-environment
    ports: ['${ENGROVE_API_PORT:-3000}:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s

  worker-node:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/worker.js']
    environment: *app-environment
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', '-e', "require('node:fs').accessSync('/tmp/engrove-worker-ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s

  worker-python:
    build:
      context: ../..
      dockerfile: deploy/docker/worker-python.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ENGROVE_VERSION: ${ENGROVE_VERSION:-0.1.0}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-engrove_internal_dev_only}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    stop_grace_period: 15s

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports: ['${ENGROVE_WEB_PORT:-4173}:4173']
    depends_on:
      api: { condition: service_healthy }

  admin:
    profiles: ['admin']
    build:
      context: ../..
      dockerfile: deploy/docker/admin.Dockerfile
    environment: *app-environment
    volumes:
      - ${ENGROVE_BACKUP_DIR:-../../backups}:/backups
      - ${BACKUP_IDENTITY_DIR:-../../backups/identities}:/identities:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
