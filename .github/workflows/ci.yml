name: Community CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.0
          enable-cache: true
      - name: Resolve tool versions
        run: node --version && pnpm --version && uv --version
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/worker-python --locked
      - run: pnpm format:check
      - run: pnpm units:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:community
      - name: Verify migration generation is clean
        env:
          DATABASE_MIGRATION_URL: postgresql://unused:unused@localhost:5432/unused
        run: pnpm db:generate && git diff --exit-code -- packages/database/drizzle

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify the Community Phase 7 stack
        run: bash scripts/phase-7-smoke.sh
      - name: Verify the Community Phase 8 golden path
        run: bash scripts/phase-8-smoke.sh
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-7-compose-logs
          path: |
            docs/verification/phase-7-compose.log
            docs/verification/phase-7-keycloak-compose.log
            docs/verification/phase-7-production-compose.log
            docs/verification/phase-8-compose.log
